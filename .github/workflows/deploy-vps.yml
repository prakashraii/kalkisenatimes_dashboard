name: Deploy dashboard to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kalkisenatimes-dashboard:latest .

      - name: Save Docker image
        run: docker save kalkisenatimes-dashboard:latest -o kalkisenatimes-dashboard.tar

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes kalkisenatimes-dashboard.tar "$VPS_USER@$VPS_HOST:/tmp/kalkisenatimes-dashboard.tar"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" << 'EOF'
            docker load -i /tmp/kalkisenatimes-dashboard.tar
            docker stop kalkisenatimes-dashboard || true
            docker rm kalkisenatimes-dashboard || true
            docker run -d \
              --name kalkisenatimes-dashboard \
              --restart unless-stopped \
              -p 127.0.0.1:8093:8093 \
              kalkisenatimes-dashboard:latest
            rm -f /tmp/kalkisenatimes-dashboard.tar
            docker ps --filter name=kalkisenatimes-dashboard --format '{{.Names}} {{.Status}} {{.Ports}}'
          EOF
